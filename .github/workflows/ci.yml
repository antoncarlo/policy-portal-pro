name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check (app and API)
        run: npm run typecheck
      - name: Regression checks
        run: npm run test:checks
      - name: Unit and flow tests
        run: npm test --if-present
      - name: Dependency audit (production, high and critical)
        run: node scripts/audit-gate.mjs
      - name: Build
        run: npx vite build
