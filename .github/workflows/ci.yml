name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check (app and API)
        run: npm run typecheck
      - name: Regression checks
        run: npm run test:checks
      - name: Unit and flow tests
        run: npm test --if-present
      - name: Dependency audit (production, high and critical)
        run: node scripts/audit-gate.mjs
      - name: Build
        run: npx vite build
      - name: Public site check (pages rendered to HTML, private shell kept apart)
        run: npm run test:public-site

  # Browser scenarios against the dev server with the network mocked (nothing real is touched).
  # The runner is pinned: `ubuntu-latest` moved to Ubuntu 26.04, where Playwright 1.56 cannot install Chromium
  # ("Playwright does not support chromium on ubuntu26.04-x64"). Go back to `ubuntu-latest` when Playwright is
  # upgraded to a release that supports that image.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser scenarios
        run: npm run test:e2e
      - name: Screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          if-no-files-found: ignore
