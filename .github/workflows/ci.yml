name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check (app and API)
        run: npm run typecheck
      - name: Regression checks
        run: npm run test:checks
      - name: Unit and flow tests
        run: npm test --if-present
      - name: Dependency audit (production, high and critical)
        run: node scripts/audit-gate.mjs
      - name: Build
        run: npx vite build
      - name: Public site check (pages rendered to HTML, private shell kept apart)
        run: npm run test:public-site
      - name: Corporate site build (tecnomga.com, static pages only)
        run: npm run build:corp
      - name: Corporate site check
        run: npm run test:corp-site

  # Browser scenarios against the dev server with the network mocked (nothing real is touched).
  # The runner is pinned: `ubuntu-latest` moved to Ubuntu 26.04, where Playwright 1.56 cannot install Chromium
  # ("Playwright does not support chromium on ubuntu26.04-x64"). Go back to `ubuntu-latest` when Playwright is
  # upgraded to a release that supports that image.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser scenarios
        run: npm run test:e2e
      - name: Screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          if-no-files-found: ignore

  # After a push to main, once the checks are green: tell the search engines that use IndexNow (Bing, Yandex, Naver,
  # Seznam) which public pages changed. Only pages whose date in the sitemap is recent are sent, so an ordinary
  # deploy of the portal sends nothing. It waits for the deploy of this commit to be online. A failure here does
  # not make the run red: the site works the same, the pages are just read later.
  indexnow:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notify IndexNow of the pages that changed
        run: node scripts/site/indexnow.mjs --days=2 --after="${{ github.event.head_commit.timestamp }}"
